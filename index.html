<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTS 위험성평가</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 3 30 28H2z%22 fill=%22none%22 stroke=%22%23111%22 stroke-width=%223%22/%3E%3Cpath d=%22M16 12v8M16 23v2%22 stroke=%22%23111%22 stroke-width=%223%22/%3E%3C/svg%3E">
<style>
:root{--ink:#111;--sub:#555;--mute:#888;--line:#cfcfcf;--line2:#999;--bg:#fff;--soft:#f4f4f4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ink)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 16px}
.hd h1{font-size:16px;font-weight:700;white-space:nowrap}
.hd select{padding:4px 6px;border:1px solid var(--line2);border-radius:6px;background:#fff}
.hd .st{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{display:flex;overflow-x:auto;padding:0 8px;gap:2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:8px 10px;color:var(--sub);text-decoration:none;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
nav a.on{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
h2{font-size:18px;margin-bottom:12px}
h3{font-size:15px;margin:18px 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.btn{padding:6px 12px;border:1px solid var(--ink);background:#fff;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--ink);color:#fff}
.btn.s{padding:3px 8px;font-size:12.5px}
.btn.g{border-color:var(--line2);color:var(--sub)}
.btn:disabled{opacity:.4;cursor:default}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.card.hi{border-color:var(--ink);border-width:1.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.kpi .n{font-size:24px;font-weight:700}
.kpi .l{color:var(--sub);font-size:12.5px}
.kpi .t{color:var(--mute);font-size:12px;margin-top:4px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f>span{font-size:11.5px;color:var(--sub)}
.f input,.f select,.f textarea,.inp{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}
.f textarea{resize:vertical;min-height:38px}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:none;border-color:var(--ink)}
.r{display:grid;gap:8px;margin-top:8px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.c3,.c4{grid-template-columns:1fr 1fr}.c2{grid-template-columns:1fr}.hd{padding:8px 12px;gap:8px}.hd h1{font-size:15px}main{padding:12px 12px 80px}.docpage{padding:8mm 5mm}}
.rk{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid var(--line2);border-radius:20px;font-size:12.5px;white-space:nowrap}
.rk.m{border:2px solid var(--ink);font-weight:700}
.rk.h{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.tag{display:inline-block;padding:0 6px;border:1px solid var(--line2);border-radius:4px;font-size:11.5px;color:var(--sub)}
.tag.b{border-color:var(--ink);color:var(--ink);font-weight:700}
.muted{color:var(--mute)}.small{font-size:12px}
.row-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-h .sp{flex:1}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ph img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:var(--soft)}
.ph .add{width:72px;height:72px;border:1px dashed var(--line2);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;font-size:12px;text-align:center;background:#fff}
.lst{border-top:1px solid var(--line)}
.lst .it{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lst .it:hover{background:var(--soft)}
.lst .it .sp{flex:1;min-width:0}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.att .a{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:46px}
.att .a .nm{flex:1;min-width:0}
.att .a img{height:34px;max-width:90px;cursor:pointer}
.att .a .x{border:none;background:none;color:var(--mute);cursor:pointer;font-size:15px}
.chk{display:flex;gap:6px;align-items:flex-start;padding:4px 0}
.chk input{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips a{padding:4px 10px;border:1px solid var(--line2);border-radius:16px;cursor:pointer;color:var(--sub);text-decoration:none;font-size:13px}
.chips a.on{border-color:var(--ink);background:var(--ink);color:#fff}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.t th{background:var(--soft);font-weight:600;font-size:12.5px}
table.t td input,table.t td select{width:100%;border:none;padding:3px;background:transparent}
.scroll{overflow-x:auto}
table.ev{min-width:760px}
table.ev td{vertical-align:middle}
table.ev td input,table.ev td select,table.ev td textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:#fff;resize:vertical}
table.ev td textarea{min-height:34px}
.tb{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:84px;z-index:5;background:#fff;padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
/* 문서 (화면·인쇄 공통) */
.doc{font-family:"Malgun Gothic","맑은 고딕",sans-serif;color:#000;background:#fff;font-size:10.5pt;line-height:1.6}
.docpage{border:1px solid var(--line2);padding:18mm 16mm;max-width:210mm;margin:0 auto 16px;min-height:120mm}
.docpage:focus{outline:2px solid var(--ink)}
.doc p{margin:3px 0}
.doc table{border-collapse:collapse;width:100%;margin:6px 0}
.doc td,.doc th{border:1px solid #000;padding:4px 6px;vertical-align:middle}
.doc th{white-space:nowrap;font-weight:700}
.doc .ind{padding-left:14px}
.doc ul.dash{list-style:none;padding-left:14px}
.doc ul.dash li::before{content:"- "}
.doc li>p:first-child{display:inline}
.doc img{max-width:100%}
.doc ul,.doc ol{padding-left:20px}
.doc h1{font-size:18pt;text-align:center;margin:0 0 10px;letter-spacing:2px}
.doc h2{font-size:12pt;margin:12px 0 6px;break-after:avoid}
.doc .c{text-align:center}.doc .rt{text-align:right}
.doc .sig{height:32px;max-width:100%;display:block;margin:0 auto}
.doc .phs{display:flex;flex-wrap:wrap;gap:6px}
.doc .phs img{width:48%;max-height:70mm;object-fit:contain;border:1px solid #000}
.doc .small{font-size:9pt}
.doc .bk{break-inside:avoid}
.fld{border-bottom:1.5px dashed #555;cursor:pointer;padding:0 3px;min-width:40px;display:inline-block}
.fld .ph{color:#999;font-style:normal}
@media print{.fld{border:none;padding:0}.fld .ph{display:none}}
.doc .land,.doc .pb{position:relative}
.doc .land h1{margin-top:4mm;margin-bottom:2px}
.doc .land h1+p.c{margin-bottom:8mm}
/* 모달 */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mo .box{background:#fff;border-radius:10px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto}
.mo .box h3{margin:0 0 10px}
.mo .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.mo canvas{width:100%;height:auto;border:1px solid var(--ink);border-radius:6px;touch-action:none;background:#fff;display:block}
.mo img.big{max-width:100%;display:block;margin:0 auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:200;display:none;max-width:90vw}
#print{display:none}
@page{size:A4;margin:0}
@page land{size:A4 landscape;margin:0}
.pw{width:100%;border-collapse:collapse}
.pw>thead>tr>td,.pw>tfoot>tr>td{height:12mm;border:none;padding:0}
.pw>tbody>tr>td{border:none;padding:0 14mm;vertical-align:top}
.pw.lw>tbody>tr>td{padding:0 10mm}
.pw.lw>thead>tr>td,.pw.lw>tfoot>tr>td{height:9mm}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print .land{page:land}
  #print .docpage{border:none;padding:0;margin:0;max-width:none;min-height:0}
  #print .pb{break-after:page}
  #print table{page-break-inside:auto}
  #print tr{break-inside:avoid}
  #print .pw>tbody>tr{break-inside:auto}
}
</style>
</head>
<body>
<header>
  <div class="hd"><h1>INTS 위험성평가</h1><select id="yearSel"></select><span class="st" id="st">불러오는 중…</span><button class="btn s" id="saveBtn" title="입력하는 즉시 자동 저장됩니다. 눌러서 바로 저장할 수도 있습니다.">저장</button></div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<div id="print" class="doc"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="jsonIn" accept="application/json,.json" hidden>
<script src="seed.js"></script>
<script src="docs-seed.js"></script>
<script type="module">
/* ============ 기본 ============ */
const VERSION = 'v1.14';
const CFG = {apiKey:"AIzaSyAoPYmhpvYIqx_yYr-Jwm5n2-wdFYtAW_c",authDomain:"ints-weekly.firebaseapp.com",projectId:"ints-weekly",storageBucket:"ints-weekly.firebasestorage.app",messagingSenderId:"421908766897",appId:"1:421908766897:web:f3c4539c61fe3b7ad28290"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const kdate = s => { if (!s) return '　　　　년　　월　　일'; const [y, m, d] = s.split('-'); return `${y}년 ${+m}월 ${+d}일`; };
const WD = ['일','월','화','수','목','금','토'];
const kdateW = s => { if (!s) return kdate(''); const [y,m,d]=s.split('-').map(Number); return `${kdate(s)} (${WD[new Date(y,m-1,d).getDay()]})`; };
const clone = o => JSON.parse(JSON.stringify(o ?? null));
function toast(m, ms = 2200) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms); }

const TYPES = ['끼임','베임','맞음','떨어짐','넘어짐','부딪힘','깔림','감전','화재·폭발','화상','화학물질 노출','근골격계질환','기타'];
const FREQ = {1:'거의 없음',2:'낮음',3:'보통',4:'높음',5:'매우 높음'};
const SEV = {1:'영향 없음',2:'경미 불휴업',3:'경미 휴업',4:'중대재해'};
const ADHOC = ['① 중대산업사고 또는 산업재해(휴업 이상) 발생','② 작업장 변경(작업자, 설비, 작업방법 및 절차 등)','③ 건설물, 기계·기구, 설비 등의 정비 또는 보수','④ 기계·기구, 설비 등의 신규 도입·변경 또는 이전','⑤ 원재료, 화학물질 등의 신규 사용 또는 변경','⑥ 그 밖에 작업환경 변화'];
const EDU_DEFAULT = '● 「위험성평가」 추진목표 및 사업주의 추진방침\n● 「위험성평가」를 위한 사전준비 및 유해·위험요인 파악 방법\n● 유해·위험요인에 대한 위험성 추정 및 결정방법\n● 위험성 감소대책 수립 및 실행의 절차와 기록유지 방법\n● 위험성평가 결과(공정별 주요 유해·위험요인 및 감소대책) 공유';
const MEET_DEFAULT = '● 위험성평가 전사 추진을 위한 계획수립의 적정성\n● 위험성평가 실시에 따른 책임과 역할 부여\n● 2025년 사후점검 지적사항 개선 계획 공유 (TBM 일지, 결과 고지, 포상, 수시평가 등)\n● 위험성평가와 관련한 관심사항 토론 등';
function grade(r) { if (!r) return ''; if (r <= 3) return '무시'; if (r <= 6) return '낮음'; if (r <= 8) return '보통'; if (r <= 11) return '약간높음'; if (r <= 15) return '높음'; return '매우높음'; }
function rkCls(r) { return r >= 12 ? 'h' : r >= 9 ? 'm' : ''; }
const isP = (o, n) => !!(((o || {}).pres || {})[n] || ((o || {}).sigs || {})[n]);
const pCount = o => (o.att || []).filter(n => isP(o, n)).length;
const pCountP = o => pCount(o) || (o.att || []).length;
const risk = (f, s) => (+f || 0) * (+s || 0);
const rk = (f, s) => { const r = risk(f, s); return r ? `<span class="rk ${rkCls(r)}">${r} ${grade(r)}</span>` : '<span class="rk">-</span>'; };

/* ============ 저장소 (Firebase → 실패 시 브라우저) ============ */
let MODE = 'local', DB = null, FS = null;
const L = {
  get(c) { try { return JSON.parse(localStorage.getItem('ra:' + c) || '{}'); } catch (e) { return {}; } },
  set(c, m) { try { localStorage.setItem('ra:' + c, JSON.stringify(m)); } catch (e) { toast('브라우저 저장 공간이 부족합니다'); throw e; } }
};
const timeout = (ms) => new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms));
async function initStore() {
  if (new URLSearchParams(location.search).has('local')) return;
  try {
    const [app, fs] = await Promise.race([Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js')]), timeout(8000)]);
    const a = app.initializeApp(CFG, 'ints-risk');
    DB = fs.getFirestore(a); FS = fs;
    await Promise.race([FS.getDoc(FS.doc(DB, 'ra_meta', '_probe')), timeout(8000)]);
    MODE = 'cloud';
  } catch (e) { console.warn('cloud off', e); MODE = 'local'; }
}
const cleanData = o => JSON.parse(JSON.stringify(o));
async function dGet(col, id) {
  if (MODE === 'cloud') { const s = await FS.getDoc(FS.doc(DB, col, id)); return s.exists() ? s.data() : null; }
  return L.get(col)[id] || null;
}
async function dPut(col, id, data) {
  data = cleanData(data);
  if (MODE === 'cloud') return FS.setDoc(FS.doc(DB, col, id), data);
  const m = L.get(col); m[id] = data; L.set(col, m);
}
async function dDel(col, id) {
  if (MODE === 'cloud') return FS.deleteDoc(FS.doc(DB, col, id));
  const m = L.get(col); delete m[id]; L.set(col, m);
}
async function dList(col, year) {
  if (MODE === 'cloud') {
    const q = FS.query(FS.collection(DB, col), FS.where('year', '==', year));
    const s = await FS.getDocs(q); const a = []; s.forEach(d => a.push({ ...d.data(), id: d.id })); return a;
  }
  return Object.entries(L.get(col)).filter(([, v]) => v.year === year).map(([id, v]) => ({ ...v, id }));
}

/* 저장 대기열 */
const pend = new Map(); let saving = 0;
function setSt(t) { $('#st').textContent = t; }
let lastSaved = '';
function stIdle() { setSt((MODE === 'cloud' ? '☁ 서버' : '⚠ 이 브라우저에만') + (lastSaved ? ` · ✓ ${lastSaved} 저장됨` : ' 저장') + ' · ' + VERSION); }
function queueSave(col, id, ms = 700) {
  const k = col + '|' + id; clearTimeout(pend.get(k)); setSt('저장 대기…');
  pend.set(k, setTimeout(() => { pend.delete(k); saveNow(col, id); }, ms));
}
async function saveNow(col, id) {
  const o = getObj(col, id); if (!o) return;
  saving++; setSt('저장 중…');
  try {
    if (col === 'meta') await dPut('ra_meta', String(S.year), S.meta);
    else if (col === 'docs') await dPut('ra_docs', S.year + '_' + id, { year: S.year, sec: id, html: S.docs[id], at: Date.now() });
    else await dPut('ra_' + col, id, o);
    const d = new Date(); lastSaved = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  } catch (e) { toast('저장 실패: ' + e.message, 5000); console.error(e); }
  saving--; if (!saving && !pend.size) stIdle();
}
async function flushAll() { const ks = [...pend.keys()]; for (const k of ks) { clearTimeout(pend.get(k)); pend.delete(k); const [c, i] = k.split('|'); await saveNow(c, i); } }
window.addEventListener('beforeunload', e => { if (pend.size || saving) { flushAll(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });

/* 사진 */
const phCache = new Map();
async function getPhoto(id) {
  if (phCache.has(id)) return phCache.get(id);
  const p = dGet('ra_photos', id).then(d => d ? d.data : '').catch(() => '');
  phCache.set(id, p); return p;
}
function compress(file, max = 1280, q = .72) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)); const w = Math.round(img.width * r), h = Math.round(img.height * r);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('이미지를 읽을 수 없습니다')); };
    img.src = u;
  });
}
function hydrate(root = document) {
  root.querySelectorAll('img[data-ph]:not([src])').forEach(async im => { const d = await getPhoto(im.dataset.ph); if (d) im.src = d; else im.alt = '없음'; });
}
const phStrip = (key, ids, label = '사진') => `<div class="ph">${(ids || []).map(i => `<img data-ph="${i}" data-phk="${key}" alt="">`).join('')}<div class="add" data-addph="${key}">+ ${esc(label)}</div></div>`;

/* ============ 상태 ============ */
const S = { year: 2026, meta: null, rows: [], tbm: [], events: [], docs: {}, tab: 'dash', id: null, f: { wp: '', proc: '', view: 'all', month: '' , doc: 'cover', pstep: {} } };
function getObj(col, id) {
  if (col === 'meta') return S.meta;
  if (col === 'docs') return S.docs[id] != null ? { html: S.docs[id] } : null;
  return (S[col] || []).find(x => x.id === id);
}
const procKey = p => p.wp + '|' + p.proc;
const procLabel = k => (k || '').replace('|', ' · ');
const procOrder = k => { const i = S.meta.procs.findIndex(p => procKey(p) === k); return i < 0 ? 99 : i; };
const wps = () => [...new Set(S.meta.procs.map(p => p.wp))];

function evidence(f) {

  const pe = ev('정기')[0], conf = pe ? wps().filter(w => ((pe.wp || {})[w] || {}).done).length : 0;
  const lastT = [...S.tbm].sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
  switch (f.title) {
    case 'TBM 실시 근거자료 확보': return S.tbm.length ? `TBM 일지 ${S.tbm.length}건 (${wps().map(w => `${w} ${S.tbm.filter(t => t.wp === w).length}`).join(' · ')}) · 최근 ${lastT?.date || ''}` : '';
    case '위험성평가 결과 고지': return pe ? `정기평가 작업장 확정 ${conf}/${wps().length}${S.meta.postDate ? ' · 게시용 결과 인쇄 ' + S.meta.postDate : ''}` : '';
    case '실시계획서 내 포상비용 반영': { const r = docf().reward, ex = docf().budget.exec.filter(x => x.cat === REWARD); return rewardTotal() ? `포상 예산 우수부서 ${won(r.dept)}만원 · 개선제안 ${won(r.idea)}만원 (계획서·예산 자동 반영)${ex.length ? ` · 지급 ${ex.length}건` : ''}` : ''; }
    case '위험성평가표 내 공정 분류표 포함': return pe ? `정기평가 ${S.meta.procs.length}개 공정 분류 · 작업장 확정 ${conf}/${wps().length} (결과서에 공정 분류표 포함)` : '';
    case '중량물 취급 작업계획서': return ev('중량물').length ? `중량물 작업계획서 ${ev('중량물').length}건` : '';
    case '불필요 작업·위험물 삭제': return S.meta.deletions.length ? `평가표 삭제 이력 ${S.meta.deletions.length}건 (사유 기록)` : '';

    case '공단 홈페이지(KRAS) 등록': return pe && conf === wps().length ? '정기평가 확정 완료 — KRAS 등록 대상' : '';
    default: return '';
  }
}

function todos() {

  const td = today(), late = S.rows.filter(r => risk(r.f, r.s) >= 9 && !r.done && r.due && r.due < td);
  if (late.length) T.push([`개선 기한이 지난 항목 ${late.length}개`, 'rows']);
  ['가공실', '품질실'].filter(w => wps().includes(w)).forEach(w => { const l = S.tbm.filter(t => t.wp === w).map(t => t.date).sort().pop(); const days = l ? Math.round((new Date(td) - new Date(l)) / 864e5) : null;
    if (days === null || days > 3) T.push([`${w} TBM ${days === null ? '기록 없음' : days + '일째 없음 (최근 ' + l + ')'}`, 'tbm']); });
  if (!ev('회의').length) T.push(['위험성평가 실시 회의 기록 없음', 'edu']);
  const edus = ev('교육'), signed = new Set(edus.flatMap(e => (e.att || []).filter(n => isP(e, n)))), total = S.meta.people.length;
  if (!edus.length) T.push(['위험성평가 교육 기록 없음', 'edu']); else if (total && signed.size / total < .8) T.push([`교육 이수 ${Math.round(signed.size / total * 100)}% — 목표 80%까지 ${Math.ceil(total * .8) - signed.size}명 남음`, 'edu']);
  if (!rewardTotal()) T.push(['포상비 금액 미정 (계획서·예산에 자동 반영됨)', 'docs']);

/* 위험성평가표 */
function rowCard(r) {

    <div class="r c3">${fld('작업장 · 공정', sel(procOpts(), r.proc, `data-b="${b('proc')}"`))}${fld('세부 작업', inp(b('task'), r.task))}${fld('재해 형태', sel([['', '선택'], ...TYPES], r.type, `data-b="${b('type')}"`))}</div>
    <div class="r c2">${fld('유해·위험요인', ta(b('hazard'), r.hazard))}${fld('현재 안전조치', ta(b('current'), r.current))}</div>
    <div class="r c4">${fld('빈도', sel([1, 2, 3, 4, 5].map(n => [n, n + ' ' + FREQ[n]]), r.f, `data-b="${b('f')}" data-n`))}${fld('강도', sel([1, 2, 3, 4].map(n => [n, n + ' ' + SEV[n]]), r.s, `data-b="${b('s')}" data-n`))}${fld('담당', inp(b('owner'), r.owner))}${fld('개선 기한', inp(b('due'), r.due, 'date'))}</div>
    <div class="r">${fld('감소대책' + (R >= 9 ? ' (필수)' : ''), ta(b('measure'), r.measure, 2, R >= 9 ? 'placeholder="위험도 9 이상 — 감소대책을 적어주세요"' : ''))}</div>
    <div class="r c4">${fld('개선 후 빈도', sel([[0, '-'], ...[1, 2, 3, 4, 5].map(n => [n, n + ' ' + FREQ[n]])], r.f2, `data-b="${b('f2')}" data-n`))}${fld('개선 후 강도', sel([[0, '-'], ...[1, 2, 3, 4].map(n => [n, n + ' ' + SEV[n]])], r.s2, `data-b="${b('s2')}" data-n`))}<div class="f"><span>잔류 위험도</span><div id="rk2-${r.id}" style="padding-top:4px">${R2 ? rk(r.f2, r.s2) : '<span class="muted small">개선 후 입력</span>'}</div></div>${fld('개선 완료일', inp(b('done'), r.done, 'date'))}</div>
    <div class="r c2"><div class="f"><span>개선 전 사진</span>${phStrip(b('before'), r.before, '전')}</div><div class="f"><span>개선 후 사진</span>${phStrip(b('after'), r.after, '후')}</div></div>
  </div>`;
}
function filteredRows() {
  const f = S.f;
  return S.rows.filter(r => (!f.wp || (r.proc || '').startsWith(f.wp + '|')) && (!f.proc || r.proc === f.proc) &&
    (f.view === 'all' || (f.view === 'tgt' && risk(r.f, r.s) >= 9) || (f.view === 'open' && risk(r.f, r.s) >= 9 && !r.done)))
    .sort((a, b) => procOrder(a.proc) - procOrder(b.proc) || a.ord - b.ord);
}

function meetingDraft(e) {
  const F = S.meta.findings, fd = F.filter(f => f.status === '완료'), fp = F.filter(f => f.status === '진행중'), fo = F.filter(f => f.status !== '완료');
  const tgt = S.rows.filter(r => risk(r.f, r.s) >= 9).sort((a, b) => risk(b.f, b.s) - risk(a.f, a.s));
  const byProc = {}; tgt.forEach(r => { const k = (r.proc || '').split('|')[1] || '기타'; (byProc[k] ||= []).push(r); });

function setPath(o, p, v) { const ks = p.split('.'); let x = o; for (let i = 0; i < ks.length - 1; i++) { if (x[ks[i]] == null) x[ks[i]] = {}; x = x[ks[i]]; } x[ks[ks.length - 1]] = v; }
function getPath(o, p) { return p.split('.').reduce((x, k) => x == null ? x : x[k], o); }
function onBind(el, evt = 'change') {
  const [col, id, path] = el.dataset.b.split('|');
  const o = getObj(col, id); if (!o) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.hasAttribute('data-n')) v = +v;
  const old = getPath(o, path);
  setPath(o, path, v);
  if (col === 'rows') {
    delete o.draft;
    if (path === 'f' || path === 's' || path === 'f2' || path === 's2') {
      const a = $('#rk-' + id); if (a) a.innerHTML = rk(o.f, o.s);
      const b2 = $('#rk2-' + id); if (b2) b2.innerHTML = risk(o.f2, o.s2) ? rk(o.f2, o.s2) : '<span class="muted small">개선 후 입력</span>';
      const c = $('#row-' + id); if (c) c.classList.toggle('hi', risk(o.f, o.s) >= 9);
    }
  }
  if (col === 'meta' && el.hasAttribute('data-proc')) {
    // 공정 이름 변경 → 평가표·기록 키 따라 바꾸기
    const i = +path.split('.')[1], p = S.meta.procs[i];
    const field = path.split('.')[2];
    const oldKey = field === 'wp' ? old + '|' + p.proc : p.wp + '|' + old, newKey = procKey(p);
    [...S.rows.map(r => ['rows', r]), ...S.events.map(e => ['events', e])].forEach(([c, x]) => { if (x.proc === oldKey) { x.proc = newKey; queueSave(c, x.id); } });
    if (field === 'wp') { S.tbm.forEach(t => { if (t.wp === old) { t.wp = v; queueSave('tbm', t.id); } }); S.meta.people.forEach(pp => { if (pp.wp === old && !S.meta.procs.some(q => q.wp === old)) pp.wp = v; }); }
  }
  queueSave(col, id);
  if (el.hasAttribute('data-rerender') && evt === 'change') route();
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.b) return onBind(el, 'change');
  if (el.dataset.flt) { S.f[el.dataset.flt] = el.value; if (el.dataset.flt === 'wp') S.f.proc = ''; if (el.dataset.flt !== 'tbmDate') route(); return; }
  if (el.dataset.hz) { const [tid, rid] = el.dataset.hz.split('|'); const t = S.tbm.find(x => x.id === tid); t.haz ||= []; t.haz = el.checked ? [...new Set([...t.haz, rid])] : t.haz.filter(x => x !== rid); queueSave('tbm', tid); return; }
  if (el.dataset.pres) { const [col, id, path, n] = el.dataset.pres.split('|'); const o = subObj(getObj(col, id), path); o.pres ||= {}; if (el.checked) o.pres[n] = true; else { delete o.pres[n]; if (o.sigs) delete o.sigs[n]; } queueSave(col, id); return; }

  if (el.id === 'yearSel') { flushAll().then(() => { location.hash = 'dash'; loadYear(+el.value); }); }
});

function signPad(name) {
  return new Promise(res => {
    const m = modal(`<h3>${esc(name)} 서명</h3><canvas id="sigC" width="600" height="240"></canvas><div class="acts"><button class="btn g" data-m="clear">지우기</button><button class="btn" data-m="no">취소</button><button class="btn p" data-m="ok">저장</button></div>`, (a, close, mm) => {
      if (a === 'clear') { ctx.clearRect(0, 0, c.width, c.height); drew = false; return; }
      if (a === 'ok') { if (!drew) { toast('서명을 해주세요'); return; } const o = document.createElement('canvas'); o.width = 300; o.height = 120; const x = o.getContext('2d'); x.drawImage(c, 0, 0, 300, 120); close(); res(o.toDataURL('image/png')); return; }
      close(); res(null);
    });
    const c = m.querySelector('#sigC'), ctx = c.getContext('2d'); let drew = false, down = false;
    ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000';
    const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
    c.addEventListener('pointerdown', e => { down = true; c.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .1, y + .1); ctx.stroke(); drew = true; });
    c.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); });
    c.addEventListener('pointerup', () => down = false); c.addEventListener('pointercancel', () => down = false);
  });
}

function opinionDraft() {
